# Un único Web Service publica React y NestJS bajo el mismo dominio HTTPS.
# Las claves sensibles no se guardan aquí: Render las solicita al crear el Blueprint.
services:
  - type: web
    runtime: node
    name: saludcerca
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build && cd backend && npm ci --include=dev && npm run db:generate && npm run build
    # Aplica migraciones pendientes y carga datos idempotentes antes de iniciar la API.
    startCommand: cd backend && npm run db:deploy && npm run db:seed && npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_AUDIO_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
